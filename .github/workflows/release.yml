# 先由 Changesets 创建可审查的 Version Packages PR；只有已消费 changeset 的版本提交才能发布 socketfuse。
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    outputs:
      has-changesets: ${{ steps.state.outputs.has-changesets }}
      version-changed: ${{ steps.state.outputs.version-changed }}
      version-pr-valid: ${{ steps.state.outputs.version-pr-valid }}
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: state
        name: Inspect release state
        env:
          BEFORE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_APP_SLUG: ${{ vars.RELEASE_APP_SLUG }}
        run: |
          # README 是 Changesets 模板，不是待消费的版本说明。
          has_changesets=false
          if find .changeset -maxdepth 1 -type f -name '*.md' ! -name 'README.md' -print -quit | grep -q .; then
            has_changesets=true
          fi
          echo "has-changesets=$has_changesets" >> "$GITHUB_OUTPUT"

          version_changed=false
          # 只比较 push 前后版本，避免普通 main 提交或手工 preflight 意外进入发布阶段。
          if [ "$EVENT_NAME" = "push" ] && git cat-file -e "$BEFORE_SHA:packages/socketfuse/package.json" 2>/dev/null; then
            previous_version=$(git show "$BEFORE_SHA:packages/socketfuse/package.json" | jq -r '.version')
            current_version=$(jq -r '.version' packages/socketfuse/package.json)
            if [ "$previous_version" != "$current_version" ]; then
              version_changed=true
            fi
          fi
          echo "version-changed=$version_changed" >> "$GITHUB_OUTPUT"

          changelog_changed=false
          # 初始空 CHANGELOG 是发布 tarball 的固定元数据；其后的业务修改只能由 Version Packages PR 写入。
          if [ "$EVENT_NAME" = "push" ] && git diff --quiet "$BEFORE_SHA" "$GITHUB_SHA" -- packages/socketfuse/CHANGELOG.md; then
            :
          elif [ "$EVENT_NAME" = "push" ] && git cat-file -e "$BEFORE_SHA:packages/socketfuse/CHANGELOG.md" 2>/dev/null; then
            changelog_changed=true
          fi

          version_pr_valid=false
          if [ "$version_changed" = true ] && [ "$EVENT_NAME" = "push" ]; then
            # 版本提交必须来自 Changesets Action 的专用 PR，防止手工改版本绕过版本计划审核。
            release_pr=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '
              [.[] | select(
                .base.ref == "main" and
                .merged_at != null and
                .title == "chore(release): version socketfuse" and
                .head.ref == "changeset-release/main" and
                .user.login == (env.RELEASE_APP_SLUG + "[bot]")
              )] | length
            ')
            if [ "$release_pr" -gt 0 ]; then
              version_pr_valid=true
            else
              echo "::error::仅允许由 Version Packages PR 合并产生的版本提交发布"
              exit 1
            fi
          fi
          if [ "$changelog_changed" = true ] && [ "$version_pr_valid" = false ]; then
            echo "::error::仅允许由 Version Packages PR 修改 CHANGELOG"
            exit 1
          fi
          if [ "$version_pr_valid" = true ]; then
            # 所有运行时代码已在其业务 PR 通过 verify；Version Packages PR 只能消费说明并写入版本元数据，
            # 此文件白名单保证发布提交不会带入未经过浏览器验证的源码改动。
            unexpected_paths=$(git diff --name-only "$BEFORE_SHA" "$GITHUB_SHA" | while IFS= read -r path; do
              case "$path" in
                packages/socketfuse/package.json|packages/socketfuse/CHANGELOG.md|.changeset/*.md)
                  ;;
                .changeset/pre.json)
                  # 正式版只允许 Changesets 清理退出预发布模式的状态文件。
                  if [ -e "$path" ] || [ "$(git show "$BEFORE_SHA:$path" | jq -r '.mode')" != "exit" ]; then
                    printf '%s\n' "$path"
                  fi
                  ;;
                *)
                  printf '%s\n' "$path"
                  ;;
              esac
            done)
            if [ -n "$unexpected_paths" ]; then
              echo "::error::Version Packages PR 包含不允许的文件：$unexpected_paths"
              exit 1
            fi
          fi
          echo "version-pr-valid=$version_pr_valid" >> "$GITHUB_OUTPUT"

  version:
    if: github.event_name == 'push' && needs.inspect.outputs.has-changesets == 'true'
    needs: inspect
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: release-app-token
        name: Create Version Packages PR token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: changesets/action@v1
        with:
          commit: 'chore(release): version socketfuse'
          github-token: ${{ steps.release-app-token.outputs.token }}
          title: 'chore(release): version socketfuse'
          version: pnpm changeset:version

  preflight:
    if: github.event_name == 'workflow_dispatch'
    needs: inspect
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @socketfuse/test exec playwright install --with-deps chromium firefox webkit
      - run: pnpm release:preflight

  publish:
    if: >-
      github.event_name == 'push' &&
      needs.inspect.outputs.has-changesets == 'false' &&
      needs.inspect.outputs.version-changed == 'true' &&
      needs.inspect.outputs.version-pr-valid == 'true'
    needs: inspect
    environment: npm
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Install Trusted Publishing compatible npm
        run: npm install --global npm@11.5.1
      - run: test "$(npm --version)" = '11.5.1'
      # 完整验收刚打包的同一 tarball，发布不能重新运行 prepack 产生另一个 artifact。
      - name: Verify exact release artifact
        run: |
          artifact_dir=$(mktemp -d "$RUNNER_TEMP/socketfuse-release.XXXXXX")
          artifact_file="$artifact_dir/socketfuse.tgz"
          SOCKETFUSE_VERIFIED_TARBALL="$artifact_file" pnpm release:verify
          echo "SOCKETFUSE_RELEASE_ARTIFACT=$artifact_file" >> "$GITHUB_ENV"
      # 此命令只存在于已验证 Version PR 身份、受保护 environment 与 OIDC 的 job。
      - run: |
          # latest 只接收正式版本；版本与实际 tarball 的一致性已在上一步校验。
          jq -e '.version | test("^[0-9]+\\.[0-9]+\\.[0-9]+$")' packages/socketfuse/package.json > /dev/null
          sha256sum --check "$SOCKETFUSE_RELEASE_ARTIFACT.sha256"
          npm publish "$SOCKETFUSE_RELEASE_ARTIFACT" --access public --tag latest
